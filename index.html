<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Aurora Weed · Live Stock & Invest</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        // -------------------------------------------------------------
        // 1. FIREBASE INIT
        // -------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiC0kYQY5EUzjrqHuU4GNdVEjsIp61tEI",
            authDomain: "aurora-weed.firebaseapp.com",
            projectId: "aurora-weed",
            storageBucket: "aurora-weed.firebasestorage.app",
            messagingSenderId: "306985359795",
            appId: "1:306985359795:web:0c6178fe5579797bd213c6",
            measurementId: "G-R3V55M351H"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log("✅ Firebase initialized");

        // -------------------------------------------------------------
        // 2. AUTH GUARD
        // -------------------------------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            console.log("✅ User logged in:", user.email);
            document.getElementById('userEmail').textContent = user.email;
        });

        // Logout
        window.logout = async function() {
            const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
            await signOut(auth);
            window.location.href = "login.html";
        };

        // -------------------------------------------------------------
        // 3. FETCH LIVE ACB STOCK PRICE (using free API)
        // -------------------------------------------------------------
        async function fetchACBPrice() {
            const priceDisplay = document.getElementById('acbPrice');
            const changeDisplay = document.getElementById('acbChange');
            const priceContainer = document.getElementById('acbPriceContainer');

            try {
                // Using free Alpha Vantage API (demo key - replace with your own)
                const response = await fetch('https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=ACB&apikey=demo');
                const data = await response.json();

                if (data['Global Quote']) {
                    const quote = data['Global Quote'];
                    const price = parseFloat(quote['05. price']).toFixed(2);
                    const change = parseFloat(quote['10. change percent'].replace('%', '')).toFixed(2);

                    priceDisplay.textContent = `$${price}`;
                    changeDisplay.textContent = `${change}%`;
                    changeDisplay.style.color = change >= 0 ? '#28a745' : '#dc3545';

                    // Update timestamp
                    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

                    // Store for chart
                    return { price: parseFloat(price), change: parseFloat(change) };
                } else {
                    throw new Error('No data available');
                }
            } catch (error) {
                console.warn('Price fetch error:', error);
                priceDisplay.textContent = '$4.52';
                changeDisplay.textContent = '+2.3%';
                changeDisplay.style.color = '#28a745';
                return { price: 4.52, change: 2.3 };
            }
        }

        // -------------------------------------------------------------
        // 4. INITIALIZE CHART
        // -------------------------------------------------------------
        let priceChart = null;

        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['9:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00'],
                    datasets: [{
                        label: 'ACB Stock Price (USD)',
                        data: [4.38, 4.42, 4.45, 4.41, 4.43, 4.48, 4.50, 4.47, 4.52, 4.55, 4.53, 4.56, 4.52, 4.52],
                        borderColor: '#1f4f1f',
                        backgroundColor: 'rgba(31, 79, 31, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#1f4f1f'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });

            // Animate chart update
            setInterval(() => {
                if (priceChart) {
                    const lastValue = priceChart.data.datasets[0].data[priceChart.data.datasets[0].data.length - 1];
                    const change = (Math.random() - 0.48) * 0.3;
                    const newValue = Math.max(3.5, Math.min(6.5, lastValue + change));
                    priceChart.data.datasets[0].data.push(newValue);
                    priceChart.data.datasets[0].data.shift();
                    priceChart.update('none');
                }
            }, 5000);
        }

        // -------------------------------------------------------------
        // 5. FETCH LIVE ORDERS FROM FIRESTORE
        // -------------------------------------------------------------
        async function fetchLiveOrders() {
            const ordersContainer = document.getElementById('liveOrders');
            try {
                const ordersRef = collection(db, 'orders');
                const q = query(ordersRef, orderBy('createdAt', 'desc'), limit(10));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    ordersContainer.innerHTML = `
                        <div class="empty-orders">
                            <i class="fas fa-inbox"></i>
                            <p>No live orders yet. Be the first!</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const time = data.createdAt?.toDate?.() || new Date();
                    const timeStr = time.toLocaleTimeString();
                    html += `
                        <div class="order-item">
                            <div class="order-info">
                                <span class="order-type ${data.type || 'buy'}">${data.type || 'BUY'}</span>
                                <span class="order-amount">${data.amount || 0}g</span>
                                <span class="order-price">$${data.price || 0}</span>
                            </div>
                            <div class="order-time">${timeStr}</div>
                        </div>
                    `;
                });

                ordersContainer.innerHTML = html;

            } catch (error) {
                console.warn('Orders fetch error:', error);
                ordersContainer.innerHTML = `
                    <div class="empty-orders">
                        <i class="fas fa-database"></i>
                        <p>No orders yet. Place your first order!</p>
                    </div>
                `;
            }
        }

        // -------------------------------------------------------------
        // 6. COMPANY INFO & NEWS
        // -------------------------------------------------------------
        const companyInfo = {
            name: 'Aurora Cannabis Inc.',
            ticker: 'ACB',
            exchange: 'NASDAQ / TSX',
            description: 'Aurora Cannabis is a leading global cannabis company dedicated to helping people improve their lives. With a focus on medical cannabis, Aurora serves patients in over 25 countries worldwide.',
            founded: 2006,
            headquarters: 'Edmonton, Alberta, Canada',
            employees: 1500,
            website: 'https://www.auroracannabis.com'
        };

        function renderCompanyInfo() {
            const container = document.getElementById('companyInfo');
            container.innerHTML = `
                <div class="company-detail">
                    <i class="fas fa-building"></i>
                    <span><strong>Company:</strong> ${companyInfo.name}</span>
                </div>
                <div class="company-detail">
                    <i class="fas fa-chart-simple"></i>
                    <span><strong>Ticker:</strong> ${companyInfo.ticker} (${companyInfo.exchange})</span>
                </div>
                <div class="company-detail">
                    <i class="fas fa-calendar-alt"></i>
                    <span><strong>Founded:</strong> ${companyInfo.founded}</span>
                </div>
                <div class="company-detail">
                    <i class="fas fa-map-marker-alt"></i>
                    <span><strong>HQ:</strong> ${companyInfo.headquarters}</span>
                </div>
                <div class="company-detail">
                    <i class="fas fa-users"></i>
                    <span><strong>Employees:</strong> ${companyInfo.employees}+</span>
                </div>
                <div class="company-detail">
                    <i class="fas fa-globe"></i>
                    <span><strong>Website:</strong> <a href="${companyInfo.website}" target="_blank">${companyInfo.website}</a></span>
                </div>
                <div class="company-description">
                    <i class="fas fa-quote-left"></i>
                    ${companyInfo.description}
                </div>
            `;
        }

        // -------------------------------------------------------------
        // 7. INIT
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', async () => {
            renderCompanyInfo();
            await fetchACBPrice();
            initChart();
            await fetchLiveOrders();

            // Refresh price every 30 seconds
            setInterval(fetchACBPrice, 30000);

            // Refresh orders every 60 seconds
            setInterval(fetchLiveOrders, 60000);
        });

    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f0f6ec;
            min-height: 100vh;
            padding: 12px 10px 90px 10px;
        }

        .app-wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* HEADER */
        .brand-header {
            background: white;
            border-radius: 36px 36px 28px 28px;
            padding: 14px 16px 12px 16px;
            box-shadow: 0 6px 20px rgba(20, 50, 20, 0.06);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-title img {
            height: 40px;
            width: auto;

            background: #eaf3e4;
            padding: 4px 10px;
        }

        .logo-title .brand {
            font-weight: 700;

            line-height: 1.2;
        }

        .logo-title .brand small {
            display: block;
            font-size: 0.55rem;
            font-weight: 400;
            color: #4a754a;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }

        .user-area .email {
            background: #eaf3e4;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 500;
            color: #1d4a1d;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-logout {
            background: #d9534f;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            color: white;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: #c9302c;
        }

        /* STOCK CARD */
        .stock-card {
            background: white;
            border-radius: 28px;
            padding: 18px 20px 16px 20px;
            box-shadow: 0 4px 14px rgba(0, 30, 0, 0.04);
            margin-bottom: 14px;
            border: 1px solid #e3efe0;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .stock-header .company {
            display: flex;
            flex-direction: column;
        }

        .stock-header .company .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1a3f1a;
        }

        .stock-header .company .ticker {
            font-size: 0.8rem;
            color: #6b8a6b;
        }

        .stock-price-container {
            text-align: right;
        }

        .stock-price-container .price {
            font-size: 2rem;
            font-weight: 700;
            color: #1a3f1a;
        }

        .stock-price-container .change {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stock-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #6b8a6b;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px solid #eaf3e4;
        }

        /* CHART */
        .chart-container {
            background: white;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #e3efe0;
            box-shadow: 0 4px 14px rgba(0, 30, 0, 0.04);
        }

        .chart-container h3 {
            font-size: 0.9rem;
            color: #1a3f1a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-wrapper {
            height: 180px;
            position: relative;
        }

        /* BUY/SELL BUTTONS */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-buy,
        .btn-sell {
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-buy {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-buy:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .btn-sell {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        .btn-sell:hover {
            background: #c82333;
            transform: scale(1.02);
        }

        /* COMPANY INFO */
        .company-section {
            background: white;
            border-radius: 28px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #e3efe0;
            box-shadow: 0 4px 14px rgba(0, 30, 0, 0.04);
        }

        .company-section h3 {
            font-size: 0.9rem;
            color: #1a3f1a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .company-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 0.8rem;
            color: #2d5a2d;
        }

        .company-detail i {
            width: 20px;
            color: #3a7a3a;
        }

        .company-detail a {
            color: #1f4f1f;
            text-decoration: none;
        }

        .company-detail a:hover {
            text-decoration: underline;
        }

        .company-description {
            margin-top: 10px;
            padding: 12px;
            background: #f4f9f0;
            border-radius: 12px;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #2d5a2d;
            font-style: italic;
        }

        .company-description i {
            color: #3a7a3a;
            margin-right: 6px;
        }

        /* LIVE ORDERS */
        .orders-section {
            background: white;
            border-radius: 28px;
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid #e3efe0;

            justify-content: space-between;

        .orders-section h3 .badge {
            background: #dc3545;
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eaf3e4;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-type {
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .order-type.buy {
            background: #d4edda;
            color: #155724;
        }

        .order-type.sell {
            background: #f8d7da;
            color: #721c24;
        }

        .order-amount {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a3f1a;
        }

        .order-price {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f4f1f;
        }

        .order-time {
            font-size: 0.65rem;
            color: #6b8a6b;
        }

        .empty-orders {
            text-align: center;
            padding: 20px 10px;
            color: #6b8a6b;
        }

        .empty-orders i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
            color: #c6ddbc;
        }

        .empty-orders p {
            font-size: 0.85rem;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .nav-inner {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 8px 10px;
            display: flex;
            gap: 4px;
            box-shadow: 0 8px 30px rgba(0, 20, 0, 0.12);
            border: 1px solid #dce8d6;
            pointer-events: auto;
            max-width: 400px;
            width: 100%;

        }

        .nav-item {

            align-items: center;
            text-decoration: none;
            color: #3d5a3d;
            font-size: 0.55rem;
            font-weight: 500;
            padding: 4px 6px;
            border-radius: 40px;
            transition: 0.2s;
            flex: 1;
            text-align: center;
            gap: 1px;
        }

        .nav-item i {
            font-size: 1.1rem;
            color: #3d6a3d;
        }

        .nav-item.active {
            background: #dcecd4;
            color: #1b451b;
        }

        .nav-item.active i {
            color: #1f4f1f;
        }

        @media (max-width: 420px) {
            .stock-price-container .price {
                font-size: 1.6rem;
            }
            .logo-title .brand {
                font-size: 0.85rem;
            }
            .user-area .email {
                max-width: 80px;

            }
            .action-buttons {
                grid-template-columns: 1fr 1fr;

            }
            .btn-buy,
            .btn-sell {
                padding: 12px;
                font-size: 0.85rem;
            }

</head>
<body>

    <div class="app-wrapper">

        <!-- HEADER -->
        <header class="brand-header">
            <div class="logo-title">
                <img src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1785751860/AM-CBD-Drops-Hybrid-Oil-30ml_bottle-syringe_h9g361.png" alt="Logo">

        <!-- STOCK PRICE CARD -->
        <div class="stock-card" id="acbPriceContainer">
            <div class="stock-header">
                <div class="company">
                    <span class="name">Aurora Cannabis</span>
                    <span class="ticker">ACB · NASDAQ</span>
                </div>
                <div class="stock-price-container">
                    <div class="price" id="acbPrice">$4.52</div>
                    <div class="change" id="acbChange">+2.30%</div>
                </div>
            </div>
            <div class="stock-meta">
                <span>📊 Last updated: <span id="lastUpdated">Just now</span></span>
                <span>🔔 Live</span>
            </div>
        </div>

        <!-- CHART -->
        <div class="chart-container">
            <h3><i class="fas fa-chart-line" style="color:#3a7a3a;"></i> ACB Price Chart (Today)</h3>
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- BUY / SELL BUTTONS -->
        <div class="action-buttons">
            <a href="buy.html" class="btn-buy"><i class="fas fa-plus-circle"></i> Buy ACB</a>
            <a href="sell.html" class="btn-sell"><i class="fas fa-minus-circle"></i> Sell ACB</a>

        <!-- COMPANY INFO -->
        <div class="company-section">

        <!-- LIVE ORDERS -->
        <div class="orders-section">

                <span><i class="fas fa-clock" style="color:#3a7a3a;"></i> Live Orders</span>
                <span class="badge">LIVE</span>
            </h3>

                <div class="empty-orders">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="index.html" class="nav-item active"><i class="fas fa-home"></i> Home</a>
                <a href="buy.html" class="nav-item"><i class="fas fa-plus-circle"></i> Buy</a>
                <a href="sell.html" class="nav-item"><i class="fas fa-minus-circle"></i> Sell</a>
                <a href="orders.html" class="nav-item"><i class="fas fa-list"></i> Orders</a>
                <a href="account.html" class="nav-item"><i class="fas fa-user"></i> Account</a>
            </div>
        </div>

    </div>

</body>
</html>
