<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Admin Dashboard · Aurora Weed</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Firebase SDKs (modular v9+) -->
    <script type="module">
        // -------------------------------------------------------------
        // 1. FIREBASE INIT (NEW CREDENTIALS)
        // -------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // Your new Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAiC0kYQY5EUzjrqHuU4GNdVEjsIp61tEI",
            authDomain: "aurora-weed.firebaseapp.com",
            projectId: "aurora-weed",
            storageBucket: "aurora-weed.firebasestorage.app",
            messagingSenderId: "306985359795",
            appId: "1:306985359795:web:0c6178fe5579797bd213c6",
            measurementId: "G-R3V55M351H"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        console.log("✅ Firebase initialized with new credentials");

        // -------------------------------------------------------------
        // 2. AUTH GUARD
        // -------------------------------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            console.log("✅ Admin logged in:", user.email);
            document.getElementById('adminEmail').textContent = user.email;
        });

        // Logout
        window.logout = async function() {
            await signOut(auth);
            window.location.href = "login.html";
        };

        // -------------------------------------------------------------
        // 3. CLOUDINARY CONFIG
        // -------------------------------------------------------------
        const cloudinaryConfig = { cloudName: "dp81zzxlh", uploadPreset: "unsignedpreset" };
        const CLOUD_URL = `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/upload`;

        // -------------------------------------------------------------
        // 4. UPLOAD IMAGE TO CLOUDINARY
        // -------------------------------------------------------------
        window.uploadToCloudinary = async function(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', cloudinaryConfig.uploadPreset);

            try {
                const response = await fetch(CLOUD_URL, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                return data.secure_url;
            } catch (error) {
                console.error('Cloudinary upload error:', error);
                return null;
            }
        };

        // -------------------------------------------------------------
        // 5. COLLECTIONS & CRUD OPERATIONS
        // -------------------------------------------------------------
        const collections = ['deals', 'selling', 'users', 'youtube', 'products', 'investments', 'updates'];

        // Load collection data
        window.loadCollection = async function(collectionName) {
            const container = document.getElementById('dataDisplay');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

            try {
                const querySnapshot = await getDocs(collection(db, collectionName));
                let html = `<div class="collection-header">
                    <h3><i class="fas fa-database"></i> ${collectionName.toUpperCase()}</h3>
                    <span class="count">${querySnapshot.size} documents</span>
                </div>`;

                if (querySnapshot.empty) {
                    html += `<div class="empty-state"><i class="fas fa-inbox"></i> No documents in this collection</div>`;
                } else {
                    html += `<div class="table-wrapper"><table>
                        <thead><tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Actions</th>
                        </tr></thead><tbody>`;
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const dataStr = JSON.stringify(data, null, 2);
                        const preview = dataStr.length > 100 ? dataStr.substring(0, 100) + '...' : dataStr;
                        html += `
                            <tr>
                                <td class="doc-id">${doc.id.substring(0, 12)}...</td>
                                <td><pre class="data-preview">${preview}</pre></td>
                                <td class="actions-cell">
                                    <button class="btn-sm btn-danger" onclick="deleteDocument('${collectionName}','${doc.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                    <button class="btn-sm btn-primary" onclick="viewDocument('${collectionName}','${doc.id}')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table></div>`;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
            }
        };

        // Delete document
        window.deleteDocument = async function(collectionName, docId) {
            if (!confirm(`Delete document ${docId} from ${collectionName}?`)) return;
            try {
                await deleteDoc(doc(db, collectionName, docId));
                alert('✅ Document deleted successfully');
                loadCollection(collectionName);
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        // View document (show full data)
        window.viewDocument = async function(collectionName, docId) {
            try {
                const docRef = doc(db, collectionName, docId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const modal = document.getElementById('docModal');
                    document.getElementById('modalTitle').textContent = `Document: ${docId}`;
                    document.getElementById('modalContent').textContent = JSON.stringify(data, null, 2);
                    modal.style.display = 'flex';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        // Close modal
        window.closeModal = function() {
            document.getElementById('docModal').style.display = 'none';
        };

        // -------------------------------------------------------------
        // 6. ADD DOCUMENT FORM (with Cloudinary upload)
        // -------------------------------------------------------------
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const collectionName = document.getElementById('formCollection').value;
            const docData = document.getElementById('formData').value;
            const imageFile = document.getElementById('formImage').files[0];

            if (!collectionName || !docData) {
                alert('Please select a collection and enter data');
                return;
            }

            const submitBtn = document.querySelector('#addForm button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

            try {
                let data = JSON.parse(docData);

                // Upload image to Cloudinary if provided
                if (imageFile) {
                    const imageUrl = await uploadToCloudinary(imageFile);
                    if (imageUrl) {
                        data.imageUrl = imageUrl;
                        data.imageUploadedAt = new Date().toISOString();
                    }
                }

                data.createdAt = serverTimestamp();
                data.updatedAt = serverTimestamp();

                await addDoc(collection(db, collectionName), data);
                alert('✅ Document added successfully!');
                document.getElementById('addForm').reset();
                loadCollection(collectionName);
            } catch (error) {
                alert('❌ Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add Document';
            }
        });

        // -------------------------------------------------------------
        // 7. PREVIEW IMAGE
        // -------------------------------------------------------------
        document.getElementById('formImage').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.innerHTML = `<img src="${ev.target.result}" alt="Preview">`;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(this.files[0]);
            } else {
                preview.style.display = 'none';
                preview.innerHTML = '';
            }
        });

        // -------------------------------------------------------------
        // 8. INIT - LOAD DEFAULT COLLECTION
        // -------------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            loadCollection('deals');

            // Quick nav buttons
            document.querySelectorAll('.quick-nav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const collection = this.dataset.collection;
                    loadCollection(collection);
                    document.getElementById('formCollection').value = collection;
                });
            });
        });

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('docModal');
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

    </script>

    <style>

            margin: 0;

        }

        /* NAV TABS */
        .nav-tabs {
            display: flex;

            gap: 6px;

        .quick-nav-btn {
            flex: 1;
            min-width: 60px;

            border: none;
            border-radius: 14px;
            background: transparent;
            color: #3b613b;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;

        }

        .quick-nav-btn i {
            font-size: 1rem;
            color: #5a7a5a;
        }

        .quick-nav-btn:hover {
            background: #eaf3e4;
            transform: translateY(-2px);
        }

        .quick-nav-btn.active {
            background: #1f4f1f;
            color: white;
        }

        .quick-nav-btn.active i {
            color: white;
        }

        /* DATA DISPLAY */
        .data-display {
            background: white;
            border-radius: 20px;
            padding: 16px;

            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.04);
            border: 1px solid #e3efe0;
            min-height: 200px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 12px;
            padding-bottom: 10px;

        }

        .collection-header h3 {
            font-size: 1rem;

        }

            padding: 2px 12px;

        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;

        }

        table th {
            text-align: left;

        }

        table td {
            padding: 8px 6px;
            border-bottom: 1px solid #eaf3e4;
            vertical-align: top;
        }

        .doc-id {
            font-family: monospace;
            font-size: 0.65rem;
            color: #6b8a6b;
            white-space: nowrap;
        }

        .data-preview {
            font-family: monospace;
            font-size: 0.65rem;
            background: #f8fbf7;
            padding: 4px 8px;

            max-height: 60px;
            overflow: hidden;

        }

        .actions-cell {

        .btn-sm {

        }

        .btn-danger {

        }
        .btn-danger:hover {

        }

                padding: 6px 4px;
            }
            .quick-nav-btn i {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- HEADER -->
        <header class="admin-header">
            <div class="logo-area">
                <img src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1785751860/AM-CBD-Drops-Hybrid-Oil-30ml_bottle-syringe_h9g361.png" alt="Logo">
                <h1>Admin Panel <small>Aurora Weed</small></h1>
            </div>
            <div class="user-area">
                <span class="email" id="adminEmail">admin@aurora.com</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <i class="fas fa-box"></i>
                <span class="number" id="totalDeals">0</span>
                <span class="label">Deals</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <span class="number" id="totalUsers">0</span>
                <span class="label">Users</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign"></i>
                <span class="number" id="totalInvested">$0</span>
                <span class="label">Invested</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-video"></i>
                <span class="number" id="totalVideos">0</span>
                <span class="label">Videos</span>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <div class="nav-tabs">
            <button class="quick-nav-btn active" data-collection="deals">
                <i class="fas fa-handshake"></i> Deals
            </button>
            <button class="quick-nav-btn" data-collection="selling">
                <i class="fas fa-tag"></i> Selling
