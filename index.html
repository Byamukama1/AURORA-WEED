<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Aurora Weed · Live Stock & Invest</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="index.css" />
</head>
<body>

    <div class="app-wrapper">

        <!-- HEADER -->
        <header class="brand-header">
            <div class="logo-title">
                <img src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1785751860/AM-CBD-Drops-Hybrid-Oil-30ml_bottle-syringe_h9g361.png" alt="Logo" />
                <div class="brand">
                    AURORA WEED
                    <small>Invest in the Future</small>
                </div>
            </div>
            <div class="user-area">
                <span class="email" id="userEmail">user@email.com</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <!-- STOCK PRICE CARD -->
        <div class="stock-card" id="acbPriceContainer">
            <div class="stock-header">
                <div class="company">
                    <span class="name">Aurora Cannabis</span>
                    <span class="ticker">ACB · NASDAQ</span>
                </div>
                <div class="stock-price-container">
                    <div class="price" id="acbPrice">$4.52</div>
                    <div class="change" id="acbChange">+2.30%</div>
                </div>
            </div>
            <div class="stock-meta">
                <span>📊 Last updated: <span id="lastUpdated">Just now</span></span>
                <span>🔔 Live</span>
            </div>
        </div>

        <!-- CHART -->
        <div class="chart-container">
            <h3><i class="fas fa-chart-line" style="color:#3a7a3a;"></i> ACB Price Chart (Today)</h3>
            <div class="chart-wrapper">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- BUY / SELL BUTTONS -->
        <div class="action-buttons">
            <a href="buy.html" class="btn-buy"><i class="fas fa-plus-circle"></i> Buy ACB</a>
            <a href="sell.html" class="btn-sell"><i class="fas fa-minus-circle"></i> Sell ACB</a>
        </div>

        <!-- COMPANY INFO -->
        <div class="company-section">
            <h3><i class="fas fa-info-circle" style="color:#3a7a3a;"></i> About Aurora Cannabis</h3>
            <div id="companyInfo"></div>
        </div>

        <!-- LIVE ORDERS -->
        <div class="orders-section">
            <h3>
                <span><i class="fas fa-clock" style="color:#3a7a3a;"></i> Live Orders</span>
                <span class="badge">LIVE</span>
            </h3>
            <div id="liveOrders">
                <div class="empty-orders">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>

        <!-- VIDEO GALLERY: KNOW MORE ABOUT AURORA -->
        <div class="video-section">
            <h3><i class="fas fa-video" style="color:#3a7a3a;"></i> KNOW MORE ABOUT AURORA</h3>
            <div class="video-grid" id="static-videos"></div>
            <div style="margin-top: 20px; border-top: 1px solid #eaf3e4; padding-top: 16px;">
                <h4 style="font-size: 0.9rem; color: #1b3b1b; margin-bottom: 10px;">
                    <i class="fas fa-database" style="color:#3a7a3a;"></i> Latest Updates
                </h4>
                <div class="video-grid" id="firestore-videos"></div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="index.html" class="nav-item active"><i class="fas fa-home"></i> Home</a>
                <a href="buy.html" class="nav-item"><i class="fas fa-plus-circle"></i> Buy</a>
                <a href="sell.html" class="nav-item"><i class="fas fa-minus-circle"></i> Sell</a>
                <a href="orders.html" class="nav-item"><i class="fas fa-list"></i> Orders</a>
                <a href="account.html" class="nav-item"><i class="fas fa-user"></i> Account</a>
            </div>
        </div>

    </div>

    <!-- External JavaScript -->
    <script type="module" src="index.js"></script>

</body>
</html>
